<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dummy Inbox – Message Search</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e4e6eb; --text:#1c1e21; --muted:#6b7280;
    --accent:#2f6fed; --accent-soft:#e8efff; --hl:#fff1a8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:18px;white-space:nowrap}
  .brand small{font-weight:500;color:var(--muted);font-size:12px;display:block}
  .search{flex:1;max-width:640px;position:relative}
  .search input{width:100%;padding:10px 36px 10px 38px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent);background:#fff}
  .search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;display:none}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  .hint code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;cursor:pointer}
  main{flex:1;display:grid;grid-template-columns:210px 390px 1fr;min-height:0}
  aside{border-right:1px solid var(--line);padding:16px 10px;overflow:auto;background:var(--panel)}
  aside h4{margin:14px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .nav-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .nav-item:hover{background:var(--bg)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
  .count{font-size:12px;color:var(--muted)}
  .list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  .list-head{padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
  .msg{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .msg:hover{background:#fafbfc}
  .msg.active{background:var(--accent-soft)}
  .msg.unread .from,.msg.unread .subject{font-weight:700}
  .row{display:flex;justify-content:space-between;gap:8px}
  .from{font-size:14px}
  .time{font-size:12px;color:var(--muted);white-space:nowrap}
  .subject{font-size:14px;margin:2px 0}
  .snippet{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;cursor:pointer;border:1px solid transparent}
  .tag:hover{border-color:currentColor}
  .att-mini{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
  mark{background:var(--hl);padding:0 1px;border-radius:2px}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
  .reader{overflow:auto;padding:28px 36px}
  .reader h2{margin:0 0 10px;font-size:22px}
  .meta{display:flex;align-items:center;gap:12px;margin:14px 0 20px}
  .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
  .meta .who{font-size:14px}.meta .who span{color:var(--muted);font-size:13px}
  .body{line-height:1.6;font-size:15px;white-space:pre-wrap}
  .info{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:14px;max-width:520px}
  .info b{color:var(--muted);font-weight:500}
  .att-head{margin:26px 0 10px;font-size:13px;color:var(--muted);font-weight:600}
  .atts{display:flex;flex-wrap:wrap;gap:12px}
  .att{width:170px;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff}
  .att:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .att .thumb{height:110px;display:grid;place-items:center;background:#f1f3f5;overflow:hidden}
  .att .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .pdf-icon{width:54px;height:68px;background:#fff;border:1px solid #d0d4da;border-radius:4px;position:relative;display:grid;place-items:end center;padding-bottom:8px}
  .pdf-icon span{background:#d93025;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px}
  .att .name{font-size:12px;padding:8px 10px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .att .size{font-size:11px;color:var(--muted);padding:0 10px 8px}
  .placeholder{color:var(--muted);display:grid;place-items:center;height:100%;font-size:15px}
  /* preview modal */
  .modal{position:fixed;inset:0;background:rgba(20,22,26,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:24px}
  .modal.open{display:flex}
  .modal-box{background:#2b2d31;border-radius:12px;max-width:820px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:#e8eaed;font-size:14px}
  .modal-bar button{background:none;border:0;color:#e8eaed;font-size:20px;cursor:pointer}
  .modal-content{overflow:auto;padding:20px;display:flex;justify-content:center;background:#3c3f44}
  .modal-content img{max-width:100%;height:auto;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .pdf-page{background:#fff;width:100%;max-width:600px;min-height:760px;padding:48px 56px;box-shadow:0 4px 16px rgba(0,0,0,.4);font-family:Georgia,serif;color:#222}
  .pdf-page h1{font-size:20px;margin:0 0 4px}
  .pdf-page .org{color:#666;font-size:13px;margin-bottom:24px;border-bottom:2px solid #222;padding-bottom:10px}
  .pdf-page p{font-size:14px;line-height:1.7;margin:6px 0}
  .pdf-page table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
  .pdf-page td,.pdf-page th{border:1px solid #ccc;padding:6px 8px;text-align:left}
  .pdf-page .sig{margin-top:50px;font-size:13px;color:#444}
  @media (max-width:900px){main{grid-template-columns:1fr}aside,.reader{display:none}}
</style>
</head>

<header>
  <div class="brand">📬 HR Inbox<small>Curve Digital (dummy)</small></div>
  <div class="search">
    <span class="icon">🔍</span>
    <input id="q" type="text" placeholder="Search: naam, keyword, tag:sick, has:pdf, from:rabia…" autocomplete="off">
    <button class="clear" id="clear" title="Clear">✕</button>
  </div>
  <div class="hint">Try: <code>tag:opd</code> <code>#half-day</code> <code>has:pdf</code> <code>has:image</code> <code>from:hassan tag:opd</code> <code>tag:leave tag:sick</code></div>
</header>

<main>
  <aside id="sidebar"></aside>
  <section class="list" id="list"></section>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-bar"><span id="modal-title"></span><button id="modal-close" title="Close">✕</button></div>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

/* ---------- dummy attachment renderers (inline SVG, no internet needed) ---------- */
function svgURI(svg){return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
function xesc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function receiptSVG(r){
  const rows = r.items.map((it,i)=>`<text x="20" y="${170+i*24}" font-size="13">${xesc(it[0])}</text><text x="300" y="${170+i*24}" font-size="13" text-anchor="end">${xesc(it[1])}</text>`).join("");
  const y = 170 + r.items.length*24;
  return svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="${y+120}" font-family="Courier New,monospace" fill="#222">
    <rect width="100%" height="100%" fill="#fffdf6"/>
    <text x="160" y="36" font-size="17" font-weight="bold" text-anchor="middle">${xesc(r.place)}</text>
    <text x="160" y="56" font-size="11" text-anchor="middle" fill="#555">${xesc(r.addr)}</text>
    <line x1="16" y1="72" x2="304" y2="72" stroke="#999" stroke-dasharray="4 3"/>
    <text x="20" y="94" font-size="12">Receipt #: ${xesc(r.no)}</text>
    <text x="20" y="112" font-size="12">Date: ${xesc(r.date)}</text>
    <text x="20" y="130" font-size="12">Patient: ${xesc(r.patient)}</text>
    <line x1="16" y1="146" x2="304" y2="146" stroke="#999" stroke-dasharray="4 3"/>
    ${rows}
    <line x1="16" y1="${y}" x2="304" y2="${y}" stroke="#999" stroke-dasharray="4 3"/>
    <text x="20" y="${y+26}" font-size="15" font-weight="bold">TOTAL</text>
    <text x="300" y="${y+26}" font-size="15" font-weight="bold" text-anchor="end">${xesc(r.total)}</text>
    <text x="160" y="${y+62}" font-size="11" text-anchor="middle" fill="#555">PAID – CASH · Thank you</text>
    <circle cx="250" cy="${y+80}" r="26" fill="none" stroke="#1565c0" stroke-width="2" opacity=".6"/>
    <text x="250" y="${y+84}" font-size="10" text-anchor="middle" fill="#1565c0" opacity=".7">PAID</text>
  </svg>`);
}

function screenshotSVG(s){
  const lines = s.lines.map((l,i)=>`<text x="${l.indent||40}" y="${150+i*26}" font-size="14" fill="${l.color||'#333'}" font-weight="${l.bold?'bold':'normal'}">${xesc(l.t)}</text>`).join("");
  return svgURI(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" font-family="Segoe UI,Arial,sans-serif">
    <rect width="640" height="400" fill="#e9ecef"/>
    <rect x="0" y="0" width="640" height="34" fill="#d1d5db"/>
    <circle cx="18" cy="17" r="6" fill="#ff5f57"/><circle cx="38" cy="17" r="6" fill="#febc2e"/><circle cx="58" cy="17" r="6" fill="#28c840"/>
    <text x="320" y="22" font-size="12" text-anchor="middle" fill="#444">${xesc(s.window)}</text>
    <rect x="20" y="54" width="600" height="326" rx="8" fill="#fff"/>
    <rect x="20" y="54" width="600" height="50" rx="8" fill="${s.barColor||'#2f6fed'}"/>
    <rect x="20" y="90" width="600" height="14" fill="${s.barColor||'#2f6fed'}"/>
    <text x="40" y="86" font-size="17" fill="#fff" font-weight="bold">${xesc(s.title)}</text>
    ${lines}
  </svg>`);
}

let folder = "all";

function parseQuery(raw){
  const tags=[], words=[], has=[], from=[];
  raw.trim().toLowerCase().split(/\s+/).filter(Boolean).forEach(t=>{
    if(t.startsWith("tag:")) { if(t.length>4) tags.push(t.slice(4)); }
    else if(t.startsWith("from:")) { if(t.length>5) from.push(t.slice(5)); }
    else if(t.startsWith("has:")) { if(t.length>4) has.push(t.slice(4)); }
    else if(t.startsWith("#")) { if(t.length>1) tags.push(t.slice(1)); }
    else words.push(t);
  });
  return {tags, words, has, from};
}
function hasCheck(m,h){
  const a=m.attachments||[];
  if(h.startsWith("att")||h==="file") return a.length>0;
  if(h==="pdf") return a.some(x=>x.type==="pdf");
  if(["image","img","picture","pic","photo","screenshot"].includes(h)) return a.some(x=>x.type==="image");
  return true;
}
function inFolder(m){
  if(folder==="all") return true;
  if(folder==="unread") return m.unread;
  if(folder==="attachments") return (m.attachments||[]).length>0;
  if(folder.startsWith("person:")) return m.from===folder.slice(7);
  return m.tags.includes(folder);
}
function matches(m,q){
  if(!inFolder(m)) return false;
  if(q.tags.some(t=>!m.tags.some(mt=>mt.startsWith(t)))) return false;
  if(q.has.some(h=>!hasCheck(m,h))) return false;
  if(q.from.some(f=>!(m.from+" "+m.email).toLowerCase().includes(f))) return false;
  const hay = [m.from,m.email,m.dept,m.subject,m.body,m.tags.join(" "),
    Object.entries(m.info||{}).flat().join(" "),(m.attachments||[]).map(a=>a.name).join(" ")].join(" ").toLowerCase();
  return q.words.every(w=>hay.includes(w));
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function highlight(text, words){
  let out = esc(text);
  if(!words.length) return out;
  const re = new RegExp("("+words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return out.replace(re,"<mark>$1</mark>");
}
function tagChip(t){const c=TAGS[t]||{color:"#555",bg:"#eee"};return `<span class="tag" data-tag="${t}" style="color:${c.color};background:${c.bg}">#${t}</span>`}

/* ---------- render ---------- */
function renderSidebar(){
  const unread = MESSAGES.filter(m=>m.unread).length;
  const withAtt = MESSAGES.filter(m=>(m.attachments||[]).length).length;
  let html = `<div class="nav-item ${folder==="all"?"active":""}" data-folder="all"><span>📥 All messages</span><span class="count">${MESSAGES.length}</span></div>
    <div class="nav-item ${folder==="unread"?"active":""}" data-folder="unread"><span>🔵 Unread</span><span class="count">${unread}</span></div>
    <div class="nav-item ${folder==="attachments"?"active":""}" data-folder="attachments"><span>📎 With attachments</span><span class="count">${withAtt}</span></div>
    <h4>Employees</h4>`;
  Object.values(PEOPLE).forEach(pp=>{
    const n = MESSAGES.filter(m=>m.from===pp.name).length, f="person:"+pp.name;
    html += `<div class="nav-item ${folder===f?"active":""}" data-folder="${f}"><span>👤 ${pp.name}</span><span class="count">${n}</span></div>`;
  });
  html += `<h4>Tags</h4>`;
  Object.keys(TAGS).forEach(t=>{
    const n = MESSAGES.filter(m=>m.tags.includes(t)).length;
    html += `<div class="nav-item ${folder===t?"active":""}" data-folder="${t}"><span><span class="dot" style="background:${TAGS[t].color}"></span>${t}</span><span class="count">${n}</span></div>`;
  });
  $("#sidebar").innerHTML = html;
}

function renderList(){
  const q = parseQuery(qInput.value);
  const res = MESSAGES.filter(m=>matches(m,q));
  $("#clear").style.display = qInput.value ? "block" : "none";
  const label = qInput.value.trim() ? `${res.length} result${res.length!==1?"s":""} for “${esc(qInput.value.trim())}”` : `${res.length} messages`;
  let html = `<div class="list-head">${label}</div>`;
  if(!res.length) html += `<div class="empty">Koi message nahi mila 😕<br>Doosra keyword ya tag try karain.</div>`;
  res.forEach(m=>{
    const a=m.attachments||[];
    const pdfs=a.filter(x=>x.type==="pdf").length, imgs=a.filter(x=>x.type==="image").length;
    const attBadges = (pdfs?`<span class="att-mini">📄 ${pdfs} PDF</span>`:"")+(imgs?`<span class="att-mini">🖼 ${imgs} image</span>`:"");
    html += `<div class="msg ${m.unread?"unread":""} ${m.id===selectedId?"active":""}" data-id="${m.id}">
      <div class="row"><span class="from">${highlight(m.from,q.words)}</span><span class="time">${a.length?"📎 ":""}${m.time}</span></div>
      <div class="subject">${highlight(m.subject,q.words)}</div>
      <div class="snippet">${highlight(m.body.replace(/\n+/g," "),q.words)}</div>
      <div class="tags">${m.tags.map(tagChip).join("")}${attBadges}</div>
    </div>`;
  });
  $("#list").innerHTML = html;
}

function renderReader(){
  const m = MESSAGES.find(x=>x.id===selectedId);
  if(!m){ $("#reader").innerHTML = `<div class="placeholder">Koi message select karain</div>`; return; }
  const q = parseQuery(qInput.value);
  const color = TAGS[m.tags[0]]?.color || "#888";
  const info = m.info ? `<div class="info">${Object.entries(m.info).map(([k,v])=>`<b>${esc(k)}</b><span>${highlight(v,q.words)}</span>`).join("")}</div>` : "";
  const a = m.attachments||[];
  const atts = a.length ? `<div class="att-head">📎 ${a.length} attachment${a.length>1?"s":""}</div><div class="atts">${a.map((x,i)=>`
      <div class="att" data-att="${i}">
        <div class="thumb">${x.type==="image"?`<img src="${x.src}" alt="">`:`<div class="pdf-icon"><span>PDF</span></div>`}</div>
        <div class="name" title="${esc(x.name)}">${highlight(x.name,q.words)}</div>
        <div class="size">${x.type==="pdf"?"PDF":"Image"} · ${x.size}</div>
      </div>`).join("")}</div>` : "";
  $("#reader").innerHTML = `
    <h2>${highlight(m.subject,q.words)}</h2>
    <div class="tags">${m.tags.map(tagChip).join("")}</div>
    <div class="meta"><div class="avatar" style="background:${color}">${m.from[0]}</div>
      <div class="who"><b>${highlight(m.from,q.words)}</b> <span>&lt;${esc(m.email)}&gt; · ${esc(m.dept)}</span><br><span>to: hr@curvedigital.pk · ${m.time}</span></div></div>
    ${info}
    <div class="body">${highlight(m.body,q.words)}</div>
    ${atts}`;
}

function renderAll(){renderSidebar();renderList();renderReader();}

/* ---------- attachment preview ---------- */
function openPreview(att){
  $("#modal-title").textContent = att.name + "  ·  " + att.size;
  let html;
  if(att.type==="image"){ html = `<img src="${att.src}" alt="${esc(att.name)}">`; }
  else {
    const d = att.doc;
    const table = d.table ? `<table>${d.table.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>` : "";
    html = `<div class="pdf-page"><h1>${esc(d.title)}</h1><div class="org">${esc(d.org)}</div>
      ${(d.paras||[]).slice(0,1).map(p=>`<p>${esc(p)}</p>`).join("")}${table}${(d.paras||[]).slice(1).map(p=>`<p>${esc(p)}</p>`).join("")}
      <div class="sig">${d.sig||""}</div></div>`;
  }
  $("#modal-content").innerHTML = html;
  $("#modal").classList.add("open");
}
function closePreview(){ $("#modal").classList.remove("open"); }
$("#modal-close").addEventListener("click",closePreview);
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closePreview(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closePreview(); });

/* ---------- events ---------- */
function searchFor(text){ qInput.value=text; folder="all"; renderAll(); }
$("#sidebar").addEventListener("click",e=>{
  const item = e.target.closest(".nav-item"); if(!item) return;
  folder = item.dataset.folder; renderAll();
});
$("#list").addEventListener("click",e=>{
  const tag = e.target.closest(".tag");
  if(tag){ searchFor("tag:"+tag.dataset.tag); return; }
  const msg = e.target.closest(".msg"); if(!msg) return;
  selectedId = +msg.dataset.id;
  const m = MESSAGES.find(x=>x.id===selectedId); if(m) m.unread=false;
  renderAll();
});
$("#reader").addEventListener("click",e=>{
  const tag = e.target.closest(".tag");
  if(tag){ searchFor("tag:"+tag.dataset.tag); return; }
  const att = e.target.closest(".att");
  if(att){ const m = MESSAGES.find(x=>x.id===selectedId); openPreview(m.attachments[+att.dataset.att]); }
});
document.querySelector(".hint").addEventListener("click",e=>{
  const c = e.target.closest("code"); if(c) searchFor(c.textContent);
});
qInput.addEventListener("input",()=>{renderList();renderReader();});
$("#clear").addEventListener("click",()=>{qInput.value="";renderAll();qInput.focus();});

renderAll();
</script>
</body>
</html>
